services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: postgres}
    ports: ["127.0.0.1:5564:5432"]
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
volumes:
  db:
